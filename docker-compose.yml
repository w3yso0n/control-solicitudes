services:
  db:
    image: postgres:16-alpine
    container_name: beatriz-solicitudes-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beatriz-solicitudes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beatriz-solicitudes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
